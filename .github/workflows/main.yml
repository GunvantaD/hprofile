name: Hprofile Action
on : workflow_dispatch
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: hprofile
  ECS_SERVICE: hprofile-act-service
  ECS_CLUSTER: hprofile-act-cluster
  ECS_TASK_DEFINITION: aws-files/task-definition.json
  CONTAINER_NAME: vproapp
jobs:
  TESTING:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Maven Test    
        run: mvn test 

      - name: Checkstyle
        run: mvn checkstyle:checkstyle

      # Setup java 17 to be default (sonar-scanner requirement as of 5.x)
      - name: Setup Java 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '11'

      # Setup sonar-scanner
      - name: Setup SonarQube
        uses: warchant/setup-sonar-scanner@v8

      # Run sonar-scanner
      - name: SonarQube Scan
        run: sonar-scanner
            -Dsonar.host.url=${{ secrets.SONAR_URL }}
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.sources=src
            -Dsonar.junit.reportsPath=target/surefire-reports/
            -Dsonar.jacoco.reportsPath=target/jacoco.exec
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml
            -Dsonar.java.binaries=target/classes/com/visualpathit/account

       # Check the Quality Gate status.
      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }} #OPTION  
  
  BUILD_AND_PUBLISH:
    runs-on: ubuntu-latest
    needs: TESTING
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: Update application.properties variables
        run: |
          sed -i 's/^jdbc.username.*/jdbc.username\=${{ secrets.DB_USERNAME }}/' src/main/resources/application.properties
          sed -i 's/^jdbc.password.*/jdbc.password\=${{ secrets.DB_PASSWORD }}/' src/main/resources/application.properties
          sed -i 's/^db01/${{ secrets.RDS_ENDPOINT }}/' src/main/resources/application.properties 
     
      - name: upload image to ECR
        uses: appleboy/docker-ecr-action@master
        with:
            access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
            secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            registry: ${{ secrets.REGISTRY }}
            repo: hprofile 
            region: ${{ env.AWS_REGION }}
            tags: latest,${{ github.run_number}}
            daemon_off: false
            dockerfile: ./Dockerfile
            context: ./
  DEPLOY:
    runs-on: ubuntu-latest
    needs: BUILD_AND_PUBLISH
    steps:
      - name: checkout code
        uses: actions/checkout@v6
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{env.AWS_REGION }}
    
      
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
           task-definition: ${{ env.ECS_TASK_DEFINITION }}
           container-name: ${{ env.CONTAINER_NAME }}
           image: ${{ secrets.REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.run_number }}
      
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
           task-definition: ${{ steps.task-def.outputs.task-definition }}
           service: ${{ env.ECS_SERVICE }}
           cluster: ${{ env.ECS_CLUSTER }}
           wait-for-service-stability: true      
      

        